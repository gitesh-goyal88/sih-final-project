[project]
name = "aapatmitra-backend"
version = "1.0.0"
description = "AapatMitra — Rural Care Access & Continuity Network: FastAPI modular monolith (TRD ADR-01)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "celery>=5.4",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "structlog>=24.1",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
