# Gateway baseline (SECURITY Appendix A). Local/demo listens on :8080 plain HTTP;
# in staging/prod terminate TLS here (ssl_* block below) and publish 443 only.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 256k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;

  # mask secrets that may appear in query strings (WS ticket, SF-11)
  map $request_uri $masked_uri {
    ~^(?<p>[^?]*)\?(?<q>.*)ticket=[^&]+(?<r>.*)$  "$p?${q}ticket=***$r";
    default $request_uri;
  }
  log_format safe '$remote_addr - [$time_iso8601] "$request_method $masked_uri" $status $body_bytes_sent $request_time rid=$http_x_request_id';
  access_log /var/log/nginx/access.log safe;

  # TRD §13.4 limits (per-user limits beyond these live in Redis)
  limit_req_zone $binary_remote_addr zone=otp_ip:10m rate=6r/m;   # coarse; the exact 20/h per IP is enforced in Redis by the API
  limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Docker DNS, re-resolved every 10 s so restarted containers are followed (no stale upstream IPs)
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    # --- prod TLS (TLS 1.2+/1.3, HSTS — SEC-CRY-01) ---
    # listen 443 ssl http2;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_session_tickets off;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    set $api_up api:8000;
    set $web_up web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /api/v1/sos {                 # ≤ 1 KB body; never rate-rejected here (excess is deduplicated upstream)
      client_max_body_size 2k;
      proxy_pass http://$api_up;
    }
    location = /api/v1/auth/otp/request {
      limit_req zone=otp_ip burst=5 nodelay;
      proxy_pass http://$api_up;
    }
    location /api/v1/webhooks/ {
      # allow <provider-ip-ranges>; deny all;   # provider allow-list (SEC-CH-01) — set at pilot
      client_max_body_size 8k;
      proxy_pass http://$api_up;
    }
    location = /api/v1/ws {
      proxy_pass http://$api_up;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 90s;
    }
    location /api/v1/admin/users/import { client_max_body_size 1m; proxy_pass http://$api_up; }
    location /api/ {
      limit_req zone=api_ip burst=40 nodelay;
      proxy_pass http://$api_up;
    }
    location = /.well-known/jwks.json { proxy_pass http://$api_up; }
    location / { proxy_pass http://$web_up; }
  }
}
